<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 340" fill="none">
  <!-- Ilustración banner ofertas: repartidor señalando etiqueta de descuento -->
  <circle cx="250" cy="170" r="118" fill="#FBD9BC"/>
  <ellipse cx="250" cy="308" rx="120" ry="14" fill="#F5CDa4" opacity=".65"/>

  <!-- Etiqueta colgante -30% -->
  <path d="M96 6 v34" stroke="#C79A6B" stroke-width="4" stroke-linecap="round"/>
  <g transform="rotate(-10 96 92)">
    <rect x="46" y="42" width="100" height="98" rx="16" fill="#F5C86B"/>
    <rect x="46" y="42" width="100" height="98" rx="16" stroke="#E0A94E" stroke-width="3"/>
    <circle cx="96" cy="60" r="7" fill="#FFF7E6" stroke="#E0A94E" stroke-width="3"/>
    <text x="96" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#2A2440">-30%</text>
    <text x="96" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#6B5433">HOY</text>
  </g>

  <!-- Caja de cartón a los pies -->
  <g>
    <rect x="288" y="238" width="86" height="64" rx="8" fill="#E8B27D"/>
    <rect x="288" y="238" width="86" height="12" rx="6" fill="#D89C5F"/>
    <rect x="322" y="238" width="18" height="64" fill="#C98D4E" opacity=".85"/>
    <rect x="284" y="230" width="94" height="12" rx="6" fill="#EFC08C"/>
  </g>

  <!-- Repartidor -->
  <g>
    <!-- piernas -->
    <rect x="222" y="222" width="22" height="72" rx="11" fill="#2A2440"/>
    <rect x="258" y="222" width="22" height="72" rx="11" fill="#2A2440"/>
    <!-- zapatos -->
    <ellipse cx="228" cy="297" rx="19" ry="10" fill="#191331"/>
    <ellipse cx="274" cy="297" rx="19" ry="10" fill="#191331"/>
    <!-- torso -->
    <path d="M222 148 h58 a20 20 0 0 1 20 20 v46 a20 20 0 0 1 -20 20 h-58 a20 20 0 0 1 -20 -20 v-46 a20 20 0 0 1 20 -20 z" fill="#7386F6"/>
    <!-- brazo que señala la etiqueta -->
    <path d="M232 168 L158 122" stroke="#7386F6" stroke-width="20" stroke-linecap="round"/>
    <circle cx="152" cy="119" r="13" fill="#F2B58B"/>
    <!-- brazo trasero hacia la caja -->
    <path d="M272 172 L308 232" stroke="#5E6FE8" stroke-width="20" stroke-linecap="round"/>
    <circle cx="311" cy="237" r="12" fill="#E8A87C"/>
    <!-- cabeza -->
    <circle cx="251" cy="118" r="27" fill="#F2B58B"/>
    <!-- gorra -->
    <path d="M224 108 a27 27 0 0 1 54 0 z" fill="#2A2440"/>
    <path d="M218 108 h20 a6 6 0 0 1 0 12 h-20 a6 6 0 0 1 0 -12 z" fill="#191331"/>
    <circle cx="251" cy="92" r="5" fill="#F5C86B"/>
    <!-- cara -->
    <circle cx="240" cy="122" r="3" fill="#2A2440"/>
    <path d="M236 132 q6 5 12 0" stroke="#2A2440" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- destellos -->
  <g fill="#F5C86B">
    <circle cx="132" cy="200" r="6"/>
    <circle cx="386" cy="128" r="7"/>
    <circle cx="410" cy="196" r="5"/>
  </g>
</svg>
