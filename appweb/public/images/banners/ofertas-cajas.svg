<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <!-- Pila de cajas de cartón para el banner de ofertas -->
  <ellipse cx="150" cy="272" rx="112" ry="14" fill="#F5CDA4" opacity=".65"/>

  <!-- caja base grande -->
  <g>
    <rect x="52" y="182" width="196" height="88" rx="10" fill="#E8B27D"/>
    <rect x="52" y="182" width="196" height="14" rx="7" fill="#D89C5F"/>
    <rect x="140" y="182" width="20" height="88" fill="#C98D4E" opacity=".85"/>
    <rect x="46" y="172" width="208" height="14" rx="7" fill="#EFC08C"/>
    <rect x="120" y="216" width="60" height="20" rx="4" fill="#FFF7E6" opacity=".8"/>
    <text x="150" y="231" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="900" fill="#2A2440">IMPORTIFY</text>
  </g>

  <!-- caja media -->
  <g>
    <rect x="76" y="110" width="118" height="64" rx="9" fill="#EFC08C"/>
    <rect x="76" y="110" width="118" height="12" rx="6" fill="#E2A96F"/>
    <rect x="126" y="110" width="18" height="64" fill="#C98D4E" opacity=".8"/>
    <rect x="71" y="101" width="128" height="12" rx="6" fill="#F5D3A4"/>
  </g>

  <!-- caja superior abierta con papel -->
  <g>
    <rect x="104" y="46" width="76" height="56" rx="8" fill="#E8B27D"/>
    <rect x="104" y="46" width="76" height="10" rx="5" fill="#D89C5F"/>
    <rect x="135" y="46" width="14" height="56" fill="#C98D4E" opacity=".85"/>
    <path d="M112 48 q10 -20 24 -8 q6 -18 20 -6 q12 -12 20 6 q8 -8 12 8 z" fill="#FFF7E6"/>
    <circle cx="124" cy="34" r="4" fill="#F5C86B"/>
    <circle cx="164" cy="30" r="4" fill="#F5C86B"/>
  </g>

  <!-- etiqueta lila colgando -->
  <g transform="rotate(14 226 128)">
    <rect x="206" y="104" width="44" height="52" rx="9" fill="#DCDFF6"/>
    <circle cx="228" cy="116" r="4" fill="#FFF"/>
    <text x="228" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="900" fill="#2A2440">%</text>
  </g>

  <!-- destellos -->
  <g fill="#F5C86B">
    <circle cx="44" cy="120" r="6"/>
    <circle cx="262" cy="72" r="7"/>
    <circle cx="276" cy="150" r="5"/>
  </g>
</svg>
